[project]
name = "servo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gpiozero>=2.0.1.post3",
    "lgpio>=0.2.2.0",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
]

[project.scripts]
servo = "servo:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
